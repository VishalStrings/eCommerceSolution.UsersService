services:
  mysql-container:
    image: mysql:8.3.0
    container_name: mysql-container
    hostname: mysql-host-productsmicroservice

    environment:
      MYSQL_ROOT_PASSWORD: admin

    ports:
      - "3307:3306"

    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d

    networks:
      - ecommerce-network

  products-microservice:
    build:
      context: .
      dockerfile: ProductsMicroService.API/Dockerfile

    image: vishalstrings/ecommerce-products-microservice:v1.0

    container_name: products-microservice

    environment:
      MYSQL_HOST: mysql-container
      MYSQL_PASSWORD: admin

    ports:
      - "8080:8080"

    depends_on:
      - mysql-container

    networks:
      - ecommerce-network
   
  postgres-container:
         
    image: postgres:16.1
    container_name: postgres-container
    
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: eCommerceUsers
      
    ports:
      - "5432:5432"
             
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d

    networks:
      - ecommerce-network
    
  users-microservice:
    build:
      context: .
      dockerfile: eCommerce.api/Dockerfile
      
    image: vishalstrings/ecommerce-users-microservice 
    
    container_name: users-microservice
    
    environment:
      POSTGRES_HOST: postgres-container
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: eCommerceUsers
      
    ports:
      - "9090:9090"
       
    depends_on:
      - postgres-container
      
    networks:
      - ecommerce-network  

networks:
  ecommerce-network:
    driver: bridge